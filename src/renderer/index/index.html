<!DOCTYPE html>
<html>

<head>
    <title>Silence SpeedUp</title>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />

    <!-- Bootstrap -->
    <link rel="stylesheet" type="text/css" href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <script src="../../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" type="text/css" href="../../../node_modules/font-awesome/css/font-awesome.min.css" />

    <link rel="stylesheet" type="text/css" href="../common.css" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <script src="index.js"></script>
</head>

<body class="w-100 bg-light">

    <div id="gui">
        <div id="drop-zone" class="text-center">
            <div class="alert alert-info drop-allowed m-auto">
                <i class="fa fa-folder-open"></i>
                <span class="i18n-ui-dropVideo"></span>
            </div>
            <div class="alert alert-danger drop-not-allowed m-auto">
                <i class="fa fa-ban"></i>
                <span class="i18n-ui-dropNotAllowed"></span>
            </div>
        </div>

        <div class="modal fade" id="settings-modal" tabindex="-1" aria-labelledby="settings-modal-label"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="settings-modal-label">
                            <i class="fa fa-sliders mx-2"></i>
                            <span class="i18n-settings-title"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <h6 class="mt-1 mb-3">
                            <i class="fa fa-bolt mx-1"></i>
                            <span class="i18n-settings-basic"></span>
                        </h6>
                        <div class="px-2">
                            <div class="row mb-3">
                                <label for="silence-speed" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-silenceSpeed"></span>
                                </label>
                                <div class="col-sm-8">
                                    <div class="input-group mb-3">
                                        <div class="form-control d-flex align-items-center">
                                            <input type="range" min="0" class="slider" id="silence-speed"
                                                name="silence-speed" aria-describedby="silence-speed-value">
                                        </div>
                                        <div class="input-group-text d-block text-center w-40" id="silence-speed-value">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="playback-speed" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-playbackSpeed"></span>
                                </label>
                                <div class="col-sm-8">
                                    <div class="input-group mb-3">
                                        <div class="form-control d-flex align-items-center">
                                            <input type="range" min="0" class="slider" id="playback-speed"
                                                name="playback-speed" aria-describedby="playback-speed-value">
                                        </div>
                                        <div class="input-group-text d-block text-center w-40"
                                            id="playback-speed-value">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label class="col-sm-4 col-form-label form-check-label" for="mute-audio">
                                    <span class="i18n-settings-muteSilences"></span>
                                </label>
                                <div class="col-sm-8">
                                    <input class="form-check-input" type="checkbox" id="mute-audio" name="mute-audio">
                                </div>
                            </div>
                        </div>

                        <h6 class="mt-4 mb-3">
                            <i class="fa fa-music mx-1"></i>
                            <span class="i18n-settings-silence"></span>
                        </h6>
                        <div class="px-2">
                            <div class="row mb-3">
                                <label for="threshold" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-backgroundNoise"></span>
                                </label>
                                <div class="col-sm-8">
                                    <div class="input-group mb-3">
                                        <div class="form-control d-flex align-items-center">
                                            <input type="range" class="slider" min="0" id="threshold" name="threshold"
                                                aria-describedby="threshold-value">
                                        </div>
                                        <div class="input-group-text d-block text-center w-40" id="threshold-value">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="silence-minimum-duration" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-silenceMinDuration"></span>
                                </label>
                                <div class="col-sm-8">
                                    <div class="input-group mb-3">
                                        <div class="form-control d-flex align-items-center">
                                            <input type="range" class="slider" id="silence-minimum-duration"
                                                name="silence-minimum-duration"
                                                aria-describedby="silence-minimum-duration-value">
                                        </div>
                                        <div class="input-group-text d-block text-center w-40"
                                            id="silence-minimum-duration-value">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label for="silence-margin" class="col-sm-4 col-form-label">
                                <span class="i18n-settings-silenceMargin"></span>
                            </label>
                            <div class="col-sm-8">
                                <div class="input-group mb-3">
                                    <div class="form-control d-flex align-items-center">
                                        <input type="range" class="slider" id="silence-margin" name="silence-margin"
                                            aria-describedby="silence-margin-value">
                                    </div>
                                    <div class="input-group-text d-block text-center w-40" id="silence-margin-value">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h6 class="mt-4 mb-3">
                            <i class="fa fa-wrench mx-1"></i>
                            <span class="i18n-settings-advanced"></span>
                        </h6>
                        <div class="px-2">
                            <div class="row mb-3">
                                <label for="crf" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-crf"></span>
                                </label>
                                <div class="col-sm-8">
                                    <div class="input-group mb-3">
                                        <div class="form-control d-flex align-items-center">
                                            <input type="range" class="slider" id="crf" name="crf" min="0" max="51"
                                                value="22" aria-describedby="crf-value">
                                        </div>
                                        <div class="input-group-text d-block text-center w-40" id="crf-value"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="fps" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-fps"></span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="fps" name="fps"></select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="preset" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-preset"></span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="preset" name="preset"></select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="audio-rate" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-audioRate"></span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="audio-rate" name="audio-rate"></select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="tune" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-tune"></span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="tune" name="tune"></select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="video-extension" class="col-sm-4 col-form-label">
                                    <span class="i18n-settings-format"></span>
                                </label>
                                <div class="col-sm-8">
                                    <select class="form-select" id="video-extension" name="video-extension"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <span class="i18n-ui-close"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="gui-controls btn-toolbar w-100 p-2 sticky-top d-flex justify-content-between bg-light"
            role="toolbar">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-primary" id="add-files" title="Add video(s)">
                    <i class="fa fa-film mx-1"></i>
                    <span class="i18n-menu-openFile"></span>
                </button>
                <button type="button" class="btn btn-outline-primary" id="add-folder" title="Add folder">
                    <i class="fa fa-folder-open mx-1"></i>
                </button>
            </div>

            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-success" data-bs-toggle="modal"
                    data-bs-target="#settings-modal" title="Customize settings">
                    <i class="fa fa-sliders mx-1"></i>
                    <sup id="silence-speed-tag">8x</sup>/<sub id="playback-speed-tag">1x</sub>
                </button>
                <button type="button" class="btn btn-success" id="button-start">
                    <i class="fa fa-play mx-1"></i>
                    <span class="i18n-process-start"></span>
                </button>
                <button type="button" class="btn btn-outline-success" id="button-progress-mode"
                    title="Switch to progress mode">
                    <i class="fa fa-window-minimize mx-1"></i>
                </button>
            </div>

            <div class="btn-group" role="group">
                <button type="button" class="btn btn-danger" id="button-stop">
                    <i class="fa fa-stop mx-1"></i>
                    <span class="i18n-process-stop"></span>
                </button>
            </div>
        </div>

        <div class="gui-entries container-fluid position-relative pt-1 text-center">
            <div id="entry-message" class="alert alert-info m-auto d-flex align-items-center mt-5 text-start"
                role="alert">
                <i class="fa fa-info-circle fs-2 mx-2"></i>
                <div class="mx-2">
                    <span class="i18n-app-intro"></span>
                </div>
            </div>

            <table id="entry-list-table" class="table table-hover align-middle d-none">
                <thead>
                    <tr>
                        <th scope="col"><span class="i18n-file-name"></span></th>
                        <th scope="col"><span class="i18n-file-status"></span></th>
                        <th scope="col"><span class="i18n-file-actions"></span></th>
                    </tr>
                </thead>
                <tbody id="entry-list"></tbody>
            </table>
        </div>

        <div class="fixed-bottom w-100">
            <div id="gui-progress" class="position-relative w-100">
                <div class="progress rounded-0">
                    <div id="ffmpeg-progress" class="progress-bar rounded-0" role="progressbar" aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>
                <div id="ffmpeg-status"
                    class="m-0 position-absolute d-flex justify-content-between top-0 start-0 w-100 px-1">
                    <div class="flex-shrink-0 px-1 ">
                        <button type="button" id="shell-toggle" class="btn btn-sm btn-dark py-0 px-1"
                            title="Toggle logs">
                            <i class="fa fa-terminal"></i>
                        </button>
                    </div>
                    <div class="px-1 flex-grow-1">
                        <span><span class="i18n-ffmpeg-time"></span></span>
                        <span id="ffmpeg-status-time" class="px-1">--:--:--.--</span>
                    </div>
                    <div class="px-1 flex-grow-1">
                        <span><span class="i18n-ffmpeg-speed"></span></span>
                        <span id="ffmpeg-status-speed" class="px-1">-</span>
                    </div>
                    <div id="ffmpeg-status-percentage" class="flex-shrink-0 px-1">
                        -.-- %
                    </div>
                </div>
            </div>

            <code id="shell" class="d-block p-0 m-0 w-100 bg-dark text-light d-none"></code>
        </div>
    </div>

</body>

</html>
